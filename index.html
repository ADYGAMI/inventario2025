<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Principal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .menu-btn {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .menu-btn:hover {
            background-color: #f3f4f6;
            padding-left: 1.5rem;
        }
        .menu-btn.active {
            background-color: #eff6ff;
            color: #2563eb;
            border-left: 4px solid #2563eb;
            font-weight: 600;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Animación suave para el menú móvil */
        .sidebar-mobile {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-100">

    <!-- OVERLAY OSCURO (Solo móvil) -->
    <!-- Se muestra cuando el menú está abierto para oscurecer el fondo -->
    <div id="mobile-overlay" onclick="closeSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden transition-opacity opacity-0"></div>

    <!-- BARRA LATERAL (MENÚ) -->
    <!-- 
         CORRECCIÓN CLAVE:
         - 'fixed inset-y-0 left-0': En móvil se queda pegado a la pantalla y flota sobre todo.
         - 'md:relative': En escritorio vuelve a ser parte del flujo normal.
         - '-translate-x-full': Empieza oculto en móvil.
         - 'md:translate-x-0': Siempre visible en escritorio.
    -->
    <aside id="sidebar" class="sidebar-mobile fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-2xl flex flex-col transform -translate-x-full md:relative md:translate-x-0 border-r border-gray-200">
        
        <!-- Encabezado del Menú -->
        <div class="p-6 border-b border-gray-100 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-lg">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Dashboard</h1>
            </div>
            <!-- Botón cerrar (Solo móvil) -->
            <button onclick="closeSidebar()" class="md:hidden text-gray-500 hover:text-red-500 transition-colors p-2">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Navegación -->
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 pl-2">Reportes</p>
            
            <button onclick="loadPage('general.html', this)" class="menu-btn active w-full text-left px-4 py-3 rounded-r-lg flex items-center gap-3 text-gray-600 group">
                <i class="fa-solid fa-layer-group group-hover:text-blue-500 transition-colors"></i>
                <span>General</span>
            </button>

            <button onclick="loadPage('particular.html', this)" class="menu-btn w-full text-left px-4 py-3 rounded-r-lg flex items-center gap-3 text-gray-600 group">
                <i class="fa-solid fa-magnifying-glass-chart group-hover:text-blue-500 transition-colors"></i>
                <span>Particular</span>
            </button>

            <button onclick="loadPage('tamanos.html', this)" class="menu-btn w-full text-left px-4 py-3 rounded-r-lg flex items-center gap-3 text-gray-600 group">
                <i class="fa-solid fa-ruler-combined group-hover:text-blue-500 transition-colors"></i>
                <span>Tamaños</span>
            </button>
        </nav>

        <!-- Pie del Menú -->
        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <div class="flex items-center gap-2 text-sm text-gray-600">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span>Sistema en línea</span>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-full w-full">
        
        <!-- Barra Superior (Solo móvil) -->
        <header class="bg-white shadow-sm p-4 md:hidden flex items-center justify-between z-30">
            <div class="flex items-center gap-3">
                <button onclick="openSidebar()" class="text-gray-600 focus:outline-none p-2 rounded hover:bg-gray-100 active:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <span class="font-bold text-gray-800 text-lg">Menú</span>
            </div>
        </header>

        <!-- Iframe Contenedor -->
        <main class="flex-1 bg-gray-50 relative overflow-hidden">
            <iframe id="contentFrame" src="general.html" title="Contenido Principal"></iframe>
        </main>
    </div>

    <!-- LÓGICA JS MEJORADA -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        let lastWidth = window.innerWidth;

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            
            // Mostrar overlay
            overlay.classList.remove('hidden');
            // Pequeño delay para permitir la transición de opacidad
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
        }

        function closeSidebar() {
            // Solo cerrar si estamos en modo móvil (para no romper escritorio si se llama por error)
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300); // Esperar a que termine la animación
            }
        }

        function loadPage(pageUrl, buttonElement) {
            const iframe = document.getElementById('contentFrame');
            
            // Efecto visual de carga
            iframe.style.opacity = '0';
            iframe.style.transition = 'opacity 0.2s ease';
            
            setTimeout(() => {
                iframe.src = pageUrl;
                iframe.onload = () => { iframe.style.opacity = '1'; };
            }, 200);

            // Actualizar botones activos
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            if(buttonElement) buttonElement.classList.add('active');

            // Cerrar menú automáticamente en móvil
            closeSidebar();
        }

        // CORRECCIÓN DEL RESIZE:
        // Solo reaccionamos si cruzamos la barrera de los 768px (cambio de móvil a escritorio o viceversa).
        // Esto evita que el menú se cierre solo cuando la barra de direcciones del celular aparece/desaparece.
        window.addEventListener('resize', () => {
            const currentWidth = window.innerWidth;
            
            // Si cambiamos de escritorio a móvil
            if (lastWidth >= 768 && currentWidth < 768) {
                closeSidebar(); // Empezar cerrado en móvil
            }
            
            // Si cambiamos de móvil a escritorio
            if (lastWidth < 768 && currentWidth >= 768) {
                // Asegurar que el menú sea visible y limpiar overlay
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
                overlay.classList.add('opacity-0');
            }

            lastWidth = currentWidth;
        });
    </script>
</body>
</html>
