<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Principal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Efecto hover suave para el menú */
        .menu-btn {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .menu-btn:hover {
            background-color: #f3f4f6;
            padding-left: 1.5rem;
        }
        .menu-btn.active {
            background-color: #eff6ff; /* blue-50 */
            color: #2563eb; /* blue-600 */
            border-left: 4px solid #2563eb;
            font-weight: 600;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-100 relative">

    <!-- BARRA LATERAL (MENÚ) -->
    <!-- 
         CORRECCIÓN: 
         1. Se agregó 'h-full' y 'absolute' de forma permanente para móvil.
         2. 'md:relative' hace que en escritorio vuelva a comportarse como columna normal.
         3. 'z-50' asegura que flote sobre todo en móvil.
    -->
    <aside class="w-64 bg-white shadow-xl z-50 flex flex-col transition-transform duration-300 absolute md:relative h-full border-r border-gray-200" id="sidebar">
        <!-- Encabezado del Menú -->
        <div class="p-6 border-b border-gray-100 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-lg">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Dashboard</h1>
            </div>
            <!-- Botón cerrar solo visible en móvil dentro del menú -->
            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-red-500 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Opciones de Navegación -->
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 pl-2">Reportes</p>
            
            <button onclick="loadPage('general.html', this)" class="menu-btn active w-full text-left px-4 py-3 rounded-r-lg flex items-center gap-3 text-gray-600 group">
                <i class="fa-solid fa-layer-group group-hover:text-blue-500 transition-colors"></i>
                <span>General</span>
            </button>

            <button onclick="loadPage('particular.html', this)" class="menu-btn w-full text-left px-4 py-3 rounded-r-lg flex items-center gap-3 text-gray-600 group">
                <i class="fa-solid fa-magnifying-glass-chart group-hover:text-blue-500 transition-colors"></i>
                <span>Particular</span>
            </button>

            <button onclick="loadPage('tamanos.html', this)" class="menu-btn w-full text-left px-4 py-3 rounded-r-lg flex items-center gap-3 text-gray-600 group">
                <i class="fa-solid fa-ruler-combined group-hover:text-blue-500 transition-colors"></i>
                <span>Tamaños</span>
            </button>
        </nav>

        <!-- Pie del Menú -->
        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <div class="flex items-center gap-2 text-sm text-gray-600">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span>Sistema en línea</span>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <!-- Añadimos un overlay (fondo oscuro) opcional para móvil cuando el menú está abierto -->
    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden glass"></div>

    <div class="flex-1 flex flex-col h-full relative w-full transition-all duration-300">
        
        <!-- Barra Superior (Solo móvil) -->
        <header class="bg-white shadow-sm p-4 md:hidden flex items-center justify-between z-30 relative">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gray-600 focus:outline-none p-2 rounded hover:bg-gray-100 active:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <span class="font-bold text-gray-800 text-lg">Menú</span>
            </div>
            <div class="text-sm text-gray-500">v1.0</div>
        </header>

        <!-- Contenedor de las páginas (IFRAME) -->
        <main class="flex-1 bg-gray-50 relative overflow-hidden w-full h-full">
            <iframe id="contentFrame" src="general.html" title="Contenido Principal"></iframe>
        </main>
    </div>

    <!-- SCRIPT DE CONTROL -->
    <script>
        function loadPage(pageUrl, buttonElement) {
            const iframe = document.getElementById('contentFrame');
            
            // Efecto fade
            iframe.style.opacity = '0';
            setTimeout(() => {
                iframe.src = pageUrl;
                iframe.onload = () => { iframe.style.opacity = '1'; };
            }, 200);

            // Actualizar botones activos
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            if(buttonElement) buttonElement.classList.add('active');

            // En móvil, cerrar menú automáticamente al seleccionar
            if (window.innerWidth < 768) {
                closeSidebar();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            // Simplemente alternamos la clase de traducción
            const isClosed = sidebar.classList.contains('-translate-x-full');
            
            if (isClosed) {
                openSidebar();
            } else {
                closeSidebar();
            }
        }

        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Si es móvil, aseguramos que empiece cerrado
            if (window.innerWidth < 768) {
                closeSidebar();
            }
        });

        // Ajustar al redimensionar ventana
        window.addEventListener('resize', () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            if (window.innerWidth >= 768) {
                // Escritorio: siempre visible, sin overlay
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                // Móvil: empezamos cerrado si se redimensiona desde escritorio
                // (Opcional: podrías querer mantener el estado, pero esto es más seguro)
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
